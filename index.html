<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Pocket DevTools — fast, offline developer utilities that run entirely in your browser.">
  <title>Pocket DevTools</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    try {
      var savedTheme = localStorage.getItem('pocket-devtools-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (err) { /* storage blocked: keep the default dark theme */ }
  </script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
        </span>
        <h1 class="brand-name">Pocket DevTools</h1>
      </div>
      <div class="header-actions">
        <button id="search-btn" type="button" class="icon-btn" aria-label="Search tools" title="Search tools">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        </button>
        <button id="theme-toggle" type="button" class="icon-btn" aria-label="Switch to light theme" title="Switch to light theme"></button>
      </div>
    </div>
  </header>

  <main id="main" class="main">
    <section id="view-home" class="view" aria-labelledby="home-title">
      <h2 id="home-title" class="view-title" tabindex="-1" data-view-heading>All tools</h2>

      <div class="search-field">
        <label class="visually-hidden" for="tool-search">Search tools</label>
        <span class="search-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        </span>
        <input id="tool-search" type="search" placeholder="Search tools&hellip;" autocomplete="off" enterkeyhint="search">
      </div>
      <p id="search-status" class="visually-hidden" role="status"></p>

      <ul id="tool-grid" class="tool-grid"></ul>
      <p id="no-results" class="empty-state" hidden>No tools match your search. Try a different keyword.</p>

      <p class="privacy-note">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span>Your data stays in your browser. Pocket DevTools does not upload your input.</span>
      </p>
    </section>

    <div id="tool-views"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
